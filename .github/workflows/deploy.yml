name: Publish MrStore website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mrstore-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Compose metadata parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Check verified ecosystem brand artwork and deploy manifest
        run: python -m unittest discover -s tests -p 'test_platform_logos.py' -v
      - name: Validate build script
        run: python -m compileall -q scripts
      - name: Prepare independently curated and verified catalog
        run: python scripts/sync_catalog.py --output public
      - name: Check generated site and data consistency
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/assets/site.css
          test -s public/assets/site.js
          test -s public/index.json
          test -s public/release-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          i = json.loads(Path('public/index.json').read_text(encoding='utf-8'))
          r = json.loads(Path('public/release-status.json').read_text(encoding='utf-8'))
          assert i['version'] == 2 and i['app_count'] == len(i['apps'])
          assert i['app_count'] <= r['candidate_count']
          assert r['approved_count'] == len(r['approved'])
          assert r['approved_count'] in (0, i['app_count'])
          assert len({a['id'] for a in i['apps']}) == i['app_count']
          print('Valid storefront with', i['app_count'], 'entries; status:', r['status'])
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test HTTPS homepage after deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --location --fail --silent --show-error --max-time 20 \
              --output /tmp/mrstore-homepage.html https://mrpiracy94.github.io/ &&
              grep -q 'id="catalogo"' /tmp/mrstore-homepage.html; then
              echo "Public homepage is reachable and contains the catalog interface."
              exit 0
            fi
            echo "Site not ready yet (attempt $attempt/12)."
            sleep 10
          done
          echo "Public homepage failed the HTTP smoke test."
          exit 1
