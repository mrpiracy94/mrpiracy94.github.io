name: Publish MrStore website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mrstore-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Compose metadata parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Check original ecosystem brand images and publication manifest
        run: python -m unittest discover -s tests -p 'test_platform_logos.py' -v
      - name: Validate build script
        run: python -m compileall -q scripts
      - name: Set up stable Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax and catalog image sources
        run: |
          node --check assets/site.js
          node tests/catalog-smoke.cjs .
      - name: Prepare independently curated catalog
        run: python scripts/sync_catalog.py --output public
      - name: Mirror original icons into the public site
        run: python scripts/cache_icons.py --site public
      - name: Assert local app icons were cached from trusted sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('public/assets/icon-cache-report.json').read_text())
          assert data['icons_cached'] >= min(9, data['catalog_entries'])
          print(f"Cached {data['icons_cached']} of {data['catalog_entries']} original app logos.")
          PY
      - name: Verify built JavaScript and all catalog icon URLs
        run: |
          node --check public/assets/site.js
          node tests/catalog-smoke.cjs public
      - name: Validate real catalog and visual structure
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/assets/site.css
          test -s public/assets/site.js
          test -s public/index.json
          test -s public/release-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          i = json.loads(Path("public/index.json").read_text(encoding="utf-8"))
          r = json.loads(Path("public/release-status.json").read_text(encoding="utf-8"))
          html = Path("public/index.html").read_text(encoding="utf-8")
          css = Path("public/assets/site.css").read_text(encoding="utf-8")
          assert i["version"] == 2 and i["app_count"] == len(i["apps"])
          assert i["app_count"] == r["candidate_count"], "Website must show every selected upstream application"
          assert r["approved_count"] == len(r["approved"])
          assert r["approved_count"] in (0, i["app_count"])
          assert len({a["id"] for a in i["apps"]}) == i["app_count"]
          assert 'class="hero-second-line"' in html
          assert html.count('class="system-card"') == 11
          assert html.count('class="orbit-bubble orbit-bubble-') == 5
          assert 'id="preview-app-count"' in html
          assert 'class="showcase-browserbar"' in html
          assert "grid-template-columns:repeat(4,minmax(0,1fr))" in css
          print(f"Verified {i['app_count']} apps and six visual structure changes.")
          PY
      - name: Install browser regression dependencies
        if: github.event_name != 'schedule'
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Verify responsive layout and catalog interactions in Chromium
        if: github.event_name != 'schedule'
        run: python tests/test_browser.py public
      - name: Save desktop and mobile evidence
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-browser-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload compiled static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Persist generated catalog snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git fetch origin main
          git reset --hard origin/main
          cp public/index.json index.json
          cp public/release-status.json release-status.json
          git add index.json release-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(pages): sync current editorial catalog [skip ci]"
            git push origin HEAD:main
          fi
      - name: Smoke test HTTPS homepage
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --location --fail --silent --show-error --max-time 20 \
              --output /tmp/mrstore-homepage.html https://mrpiracy94.github.io/ &&
              grep -q 'id="catalogo"' /tmp/mrstore-homepage.html &&
              grep -q 'class="hero-second-line"' /tmp/mrstore-homepage.html; then
              echo "MrStore homepage online and visual update present."
              exit 0
            fi
            sleep 10
          done
          echo "Public homepage failed deployment validation."
          exit 1
